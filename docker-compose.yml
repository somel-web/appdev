version: "3.9"

services:
  appdev:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        ROOT_PASSWORD: ${ROOT_PASSWORD:-changeme}
    container_name: appdev
    restart: unless-stopped
    ports:
      - "${APACHE_HOST_PORT:-8091}:80"
      - "${SSH_HOST_PORT:-2222}:22"
      # Réserve de ports libres pour tester des apps Node/Python à la volée
      - "4801:4801"
      - "4802:4802"
      - "4803:4803"
      - "4804:4804"
      - "4805:4805"
      - "4806:4806"
    volumes:
      # IMPORTANT : Portainer parle directement au docker.sock de l'hôte, donc les sources de
      # bind mount doivent être les chemins RÉELS sur le système de fichiers HAOS.
      # /share et /media n'existent qu'à l'intérieur des conteneurs gérés par le Supervisor ;
      # côté hôte, ce sont /mnt/data/supervisor/share et /mnt/data/supervisor/media.
      # (la partie à droite du ":", elle, reste le chemin voulu DANS ce conteneur)

      # Config persistée sur l'hôte, reconstruite à l'identique en cas de réinstall
      - /mnt/data/supervisor/share/appdev/config/apache/sites-available:/etc/apache2/sites-available
      - /mnt/data/supervisor/share/appdev/config/php-fpm:/etc/php/${PHP_VERSION:-8.3}/fpm/pool.d
      - /mnt/data/supervisor/share/appdev/config/ssh/authorized_keys:/root/.ssh/authorized_keys:ro
      # Sites servis par Apache (structure actuelle conservée)
      - /mnt/data/supervisor/share/htdocs:/share/htdocs
      # Accès générique à /media (y compris les 2 disques USB montés par HAOS), lecture/écriture
      - /mnt/data/supervisor/media:/media
    # environment:
    #   - TZ=Europe/Paris
