[supervisord]
nodaemon=true
user=root

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
priority=10

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autorestart=true
priority=20

[program:apache2]
command=/usr/sbin/apache2ctl -DFOREGROUND
autorestart=true
priority=30
; Reload sans relancer le conteneur, depuis une session SSH :
;   apachectl graceful
; Reload PHP-FPM sans relancer le conteneur :
;   supervisorctl restart php-fpm   (ou kill -USR2 sur le master php-fpm)
