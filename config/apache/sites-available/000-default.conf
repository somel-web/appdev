<VirtualHost *:80>
    DocumentRoot /share/htdocs

    <Directory /share/htdocs>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM via socket unix (le pool www.conf doit écouter sur ce même socket)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    Alias /media /media
    <Directory /media>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Pour ajouter une deuxième version de PHP en parallèle (ex. 7.4) :
# 1. apt-get install php7.4-fpm dans le Dockerfile
# 2. Créer un pool dédié (ex. /etc/php/7.4/fpm/pool.d/legacy.conf, autre socket)
# 3. Ajouter un second <FilesMatch> ou un vhost séparé pointant vers ce socket
